<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status | CITY PASS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #6366F1;
            --success: #10B981;
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid var(--success);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .icon-wrapper.pending {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .icon-wrapper svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-wrapper.success svg {
            stroke: var(--success);
        }

        .icon-wrapper.pending svg {
            stroke: var(--primary);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 12px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFF 30%, #A5B4FC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-sub);
            margin: 0 0 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
            border: none;
            color: white;
            padding: 16px 32px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.25);
            width: 100%;
            box-sizing: border-box;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(99, 102, 241, 0.35);
        }

        .logo-footer {
            margin-top: 40px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        {% if status == 'PAID' %}
        <div class="icon-wrapper success">
            <svg viewBox="0 0 24 24">
                <path d="M20 6L9 17l-5-5" />
            </svg>
        </div>
        <h1>Payment Completed</h1>
        {% else %}
        <div class="icon-wrapper pending">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 6v6l4 2" />
            </svg>
        </div>
        <h1>Action Required</h1>
        {% endif %}

        <p>{{ message }}</p>

        <button class="btn" onclick="window.close();">Close This Tab</button>

        <div class="logo-footer">CITY PASS</div>
    </div>
</body>
</html>
